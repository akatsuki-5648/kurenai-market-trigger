name: Layer3-4 trigger both repos

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-main
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch market workflows (discord-rss-notifier)
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set +e
          REPO="izumoitachi-gif/discord-rss-notifier"
          for wf in market_notify.yml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            echo "market [$code] $wf"
            sleep 2
          done

      - name: Dispatch crypto workflows (kurenai-crypto-market Layer4)
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set +e
          REPO="izumoitachi-gif/kurenai-crypto-market"
          for wf in crypto_price_notify.yml crypto_flash_A.yml crypto_flash_B.yml crypto_flash_C.yml crypto_flash_D.yml crypto_debug_late.yml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            echo "crypto [$code] $wf"
            sleep 2
          done

      - name: Dispatch AI Lab news (ailab-news-bot Layer4)
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set +e
          REPO="akatsuki-5648/ailab-news-bot"
          for wf in ailab_news_notify.yml; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            echo "ailab [$code] $wf"
            sleep 2
          done
