name: Layer3 外部トリガー(discord-rss-notifier workflow群を叩く)

on:
  # 5分毎(他Botと衝突しない0,15,30,45とずれた1,16,31,46分)
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trigger-main
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger discord-rss-notifier workflows
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -e
          REPO="izumoitachi-gif/discord-rss-notifier"
          TARGETS=(
            "crypto_price_notify.yml"
            "crypto_flash_A.yml"
            "crypto_flash_B.yml"
            "crypto_flash_C.yml"
            "crypto_flash_D.yml"
            "market_notify.yml"
            "crypto_debug_late.yml"
          )
          for wf in "${TARGETS[@]}"; do
            echo "→ dispatch: $wf"
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}'
            sleep 3
          done
