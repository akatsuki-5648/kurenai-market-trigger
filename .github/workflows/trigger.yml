name: Layer3+4 外部トリガー(市場=discord-rss-notifier / 暗号=kurenai-crypto-market 2リポ並列叩き)

on:
  # 5分毎(他Botと衝突しない0,15,30,45とずれた1,16,31,46分)
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trigger-main
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger both repos (Layer4: crypto pool分離で20枠独立)
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -e
          # --- 市場系(discord-rss-notifier) ---
          MARKET_REPO="izumoitachi-gif/discord-rss-notifier"
          MARKET_TARGETS=("market_notify.yml")
          # --- 暗号系(kurenai-crypto-market) Layer4分離 ---
          CRYPTO_REPO="izumoitachi-gif/kurenai-crypto-market"
          CRYPTO_TARGETS=(
            "crypto_price_notify.yml"
            "crypto_flash_A.yml"
            "crypto_flash_B.yml"
            "crypto_flash_C.yml"
            "crypto_flash_D.yml"
            "crypto_debug_late.yml"
          )

          dispatch(){
            local repo="$1"; local wf="$2"
            local code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/actions/workflows/$wf/dispatches" \
              -d '{"ref":"main"}')
            echo "  [$code] $repo :: $wf"
          }

          echo "=== 市場系: $MARKET_REPO ==="
          for wf in "${MARKET_TARGETS[@]}"; do dispatch "$MARKET_REPO" "$wf"; sleep 2; done

          echo "=== 暗号系: $CRYPTO_REPO (Layer4分離) ==="
          for wf in "${CRYPTO_TARGETS[@]}"; do dispatch "$CRYPTO_REPO" "$wf"; sleep 2; done

          echo "=== dispatch完了・各リポの20並列プールを独立占有 ==="
